services:
  ferrous-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ferrous-frontend:latest
    container_name: ferrous-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - STATIC_DIR=/app/build
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M
    read_only: true
    user: "10001:10001"
